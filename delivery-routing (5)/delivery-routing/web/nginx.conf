map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Map page
    location / {
        try_files $uri $uri/ /index.html;
    }

    # .pmtiles base map (MapLibre reads it with HTTP Range requests)
    location /tiles/ {
        alias /srv/tiles/;
        if ($request_method = OPTIONS) { return 204; }   # CORS preflight from other sites
        types { application/octet-stream pmtiles; }
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, If-Match" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag" always;
        gzip off;
    }

    # Routing API
    location /api/ {
        proxy_pass http://dr-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;                    # WebSocket for live tracking
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    location = /nginx.conf { return 404; }
}
